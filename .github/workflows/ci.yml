name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Python 3.15 installieren
        run: uv python install 3.15 --preview

      - name: Abhängigkeiten installieren
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check --preview src tests

      - name: ruff format
        run: uv run ruff format --preview --check src tests

      - name: ty
        run: uv run ty check src tests/unit tests/integration

      - name: Pyrefly
        run: uv run pyrefly check --output-format full-text